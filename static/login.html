<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5fa">
  <meta name="robots" content="noindex">
  <title>Вход — Голосовой переводчик</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

  <!-- Переключатель темы (тот же, что в приложении) -->
  <div id="theme-toggle" class="theme-toggle glass" role="radiogroup" aria-label="Тема оформления">
    <span class="theme-thumb" aria-hidden="true"></span>
    <button id="theme-light" type="button" role="radio" aria-checked="true" aria-label="Светлая тема" data-theme-option="light" class="theme-option">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" class="sun-core"/>
        <path class="sun-rays" d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>
      </svg>
    </button>
    <button id="theme-dark" type="button" role="radio" aria-checked="false" aria-label="Тёмная тема" data-theme-option="dark" class="theme-option">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="moon-shape" d="M20.5 13.2A8.5 8.5 0 1110.8 3.5a6.7 6.7 0 009.7 9.7z"/>
      </svg>
    </button>
  </div>

  <main class="login-shell">
    <section class="glass login-card" aria-labelledby="login-title">
      <div class="mic login-logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0014 0M12 18v4M8 22h8"/>
        </svg>
      </div>
      <div class="login-heading">
        <h1 id="login-title" class="login-title t-primary">Голосовой переводчик</h1>
        <p class="login-subtitle t-muted">Войдите, чтобы продолжить</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label class="field-label t-muted" for="login-username">Логин</label>
          <input id="login-username" class="input" type="text" name="username" autocomplete="username"
            autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
        </div>
        <div class="field">
          <label class="field-label t-muted" for="login-password">Пароль</label>
          <div class="input-wrap">
            <input id="login-password" class="input" type="password" name="password" autocomplete="current-password"
              autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
            <button id="login-reveal" type="button" class="reveal-btn" aria-pressed="false" aria-label="Показать пароль">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M4 4l16 16"/>
              </svg>
            </button>
          </div>
        </div>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button id="login-submit" type="submit" class="mic glass-btn login-btn">Войти</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
