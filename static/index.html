<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5fa">
  <title>Голосовой переводчик</title>
  <script src="js/theme-init.js"></script>
  <script src="js/auth-guard.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

  <!-- Переключатель темы: слайдер с солнцем и луной, оба значка видны сразу -->
  <div id="theme-toggle" class="theme-toggle glass" role="radiogroup" aria-label="Тема оформления">
    <span class="theme-thumb" aria-hidden="true"></span>
    <button id="theme-light" type="button" role="radio" aria-checked="true" aria-label="Светлая тема" data-theme-option="light" class="theme-option">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" class="sun-core"/>
        <path class="sun-rays" d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>
      </svg>
    </button>
    <button id="theme-dark" type="button" role="radio" aria-checked="false" aria-label="Тёмная тема" data-theme-option="dark" class="theme-option">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="moon-shape" d="M20.5 13.2A8.5 8.5 0 1110.8 3.5a6.7 6.7 0 009.7 9.7z"/>
      </svg>
    </button>
  </div>

  <!-- Выход: забывает токен и открывает страницу входа -->
  <button id="logout-btn" type="button" class="logout-btn glass glass-btn" aria-label="Выйти" title="Выйти">
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
    </svg>
  </button>

  <div class="app-shell">

    <main class="app-main">
      <section class="glass text-card">
        <h2 class="card-title t-muted">Вы сказали</h2>
        <p id="source-text" class="text-scroll t-primary">
          <span class="t-faint">Здесь появится распознанный текст…</span>
        </p>
      </section>

      <section class="glass text-card">
        <h2 class="card-title t-muted">Перевод</h2>
        <p id="translated-text" class="text-scroll t-primary">
          <span class="t-faint">Здесь появится перевод…</span>
        </p>
      </section>
    </main>

    <footer class="app-footer">
      <p id="status" class="status-text t-muted">Нажмите для записи</p>

      <div class="glass panel panel-langs">
        <select id="lang-from" aria-label="Язык оригинала" class="glass-select">
          <option value="ru" selected>Русский</option>
          <option value="en">English</option>
          <option value="sr">Srpski</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
        </select>

        <button id="swap-btn" type="button" aria-label="Поменять языки"
          class="glass glass-btn swap-btn">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>

        <select id="lang-to" aria-label="Язык перевода" class="glass-select">
          <option value="ru">Русский</option>
          <option value="en" selected>English</option>
          <option value="sr">Srpski</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
        </select>
      </div>

      <div class="glass panel panel-mics">
        <div class="mic-col">
          <button id="mic-from" type="button" aria-label="Говорить на языке оригинала"
            class="mic glass-btn mic-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 11a7 7 0 0014 0M12 18v4M8 22h8"/>
            </svg>
          </button>
        </div>
        <div class="swap-spacer" aria-hidden="true"></div>
        <div class="mic-col">
          <button id="mic-to" type="button" aria-label="Говорить на языке перевода"
            class="mic glass-btn mic-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 11a7 7 0 0014 0M12 18v4M8 22h8"/>
            </svg>
          </button>
        </div>
      </div>
      <button id="retry-btn" type="button" hidden aria-label="Переотправить неотправленный текст"
        class="mic retry-btn glass-btn">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0115.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 01-15.5 6.3L3 16M3 21v-5h5"/>
        </svg>
        Переотправить
      </button>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
